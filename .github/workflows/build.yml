name: Build

on:
  push:
    branches: [main, "ci/**"]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      - name: Check tag and version consistency
        if: startsWith(github.ref, 'refs/tags/')
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          VER=$(grep -oP '^version=\K.*' gradle.properties)
          TAG="${REF_NAME#v}"
          if [ "$VER" != "$TAG" ]; then
            echo "tag $TAG 与 gradle.properties version $VER 不一致" >&2
            exit 1
          fi
          git log -1 --pretty=%b "${REF_NAME}" | sed '/./,$!d' > release_notes.md
          if [ ! -s release_notes.md ]; then
            echo "发版提交正文缺少结构化更新日志" >&2
            exit 1
          fi
          cat release_notes.md

      - name: Check existing release
        id: release_check
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build
        if: steps.release_check.outputs.exists != 'true'
        run: ./gradlew build --no-daemon

      - name: Upload build artifact
        if: steps.release_check.outputs.exists != 'true'
        uses: actions/upload-artifact@v7
        with:
          name: MikuFirstSpawn
          retention-days: 3
          path: build/libs/*.jar
          if-no-files-found: error

      - name: Publish Release
        if: startsWith(github.ref, 'refs/tags/') && steps.release_check.outputs.exists != 'true'
        uses: softprops/action-gh-release@v3
        with:
          files: build/libs/*.jar
          body_path: release_notes.md
